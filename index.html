<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gasto Controlado</title>
</head>
<body>
    <header>
        <h1>Gasto Controlado</h1>
        <nav>
            <ul>
                <li><a href="#cadastro">Cadastrar</a></li>
                <li><a href="listagem">Gastos</a></li>
                <li><a href="detalhes">Detalhes</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="cadastro">
  <h2>Cadastrar gasto</h2>

  <form>
    <p>
      <label for="descricao">Descrição</label>
      <input type="text" id="descricao" name="descricao" required>
    </p>

    <p>
      <label for="valor">Valor (R$)</label>
      <input type="number" id="valor" name="valor" min="0" step="0.01" required>
    </p>

    <p>
      <label for="data">Data</label>
      <input type="date" id="data" name="data" required>
    </p>

    <p>
      <label for="categoria">Categoria</label>
      <select id="categoria" name="categoria" required>
        <option value="">Selecione</option>
        <option value="alimentacao">Alimentação</option>
        <option value="transporte">Transporte</option>
        <option value="moradia">Moradia</option>
        <option value="lazer">Lazer</option>
        <option value="estudos">Estudos</option>
        <option value="saude">Saúde</option>
        <option value="outros">Outros</option>
      </select>
    </p>

    <fieldset>
      <legend>Tipo</legend>
      <input type="radio" id="despesa" name="tipo" value="despesa" checked>
      <label for="despesa">Despesa</label>

      <input type="radio" id="receita" name="tipo" value="receita">
      <label for="receita">Receita</label>
    </fieldset>

    <p>
      <label for="observacoes">Observações</label>
      <textarea id="observacoes" name="observacoes" rows="3"></textarea>
    </p>

    <button type="submit">Salvar</button>
    <button type="reset">Limpar</button>
  </form>
</section>

    </main>
    <footer>
        <p>&copy; 2026 Gasto controlado </p>
    </footer>
</body>
</html>
